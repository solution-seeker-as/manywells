[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "manywells"
version = "1.0.0"
description = "ManyWells: simulation of multiphase flow in vertical oil and gas wells"
readme = "README.md"
license = "CC-BY-NC-4.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "casadi>=3.6.4",
    "datasets",
]
authors = [
  {name = "Bjarne Grimstad"},
  {name = "Erlend Lundby"},
]
maintainers = [
  {name = "Bjarne Grimstad", email = "bjarne.grimstad@solutionseeker.no"},
]

[project.urls]
Repository = "https://github.com/solution-seeker-as/manywells.git"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
