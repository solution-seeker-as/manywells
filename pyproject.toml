[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

# The Rust core (rust/) is built as the extension module manywells._core, next to the Python package in src/
[tool.maturin]
python-source = "src"
module-name = "manywells._core"
manifest-path = "rust/Cargo.toml"
bindings = "pyo3"

[project]
name = "manywells"
version = "1.0.0"
description = "ManyWells: simulation of multiphase flow in vertical oil and gas wells"
readme = "README.md"
license = "CC-BY-NC-4.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "casadi>=3.6.4",
    "datasets",
]
authors = [
  {name = "Bjarne Grimstad"},
  {name = "Erlend Lundby"},
]
maintainers = [
  {name = "Bjarne Grimstad", email = "bjarne.grimstad@solutionseeker.no"},
]

[project.urls]
Repository = "https://github.com/solution-seeker-as/manywells.git"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "manywells-verify",
]

[tool.uv]
# Rebuild the extension when the Rust core changes
cache-keys = [{ file = "pyproject.toml" }, { file = "rust/Cargo.toml" }, { file = "rust/Cargo.lock" },
              { file = "rust/src/**/*.rs" }]

[tool.uv.workspace]
members = ["verification"]

[tool.uv.sources]
manywells-verify = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "verification/tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
