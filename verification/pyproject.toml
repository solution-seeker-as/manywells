[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "manywells-verify"
version = "0.1.0"
description = "Verifier for ManyWells solutions against reference roots computed from ManyWells v1.0.0"
license = "CC-BY-NC-4.0"
requires-python = ">=3.11"
# No dependency on manywells or CasADi: the verifier holds no model and stays independent of what it checks.
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "pyarrow>=12",
]
authors = [
  {name = "Bjarne Grimstad"},
]

[project.scripts]
manywells-verify = "manywells_verify.cli:main"
manywells-verify-distributions = "manywells_verify.distributions:main"
