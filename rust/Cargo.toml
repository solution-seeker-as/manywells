[package]
name = "manywells-core"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "The Rust core of ManyWells, built as the Python extension manywells._core"
license = "CC-BY-NC-4.0"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.0"

[profile.release]
debug = "line-tables-only"
