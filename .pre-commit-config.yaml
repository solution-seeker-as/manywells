# Lint and format each commit's Python files with the ruff that uv.lock pins (the dependency group "lint"), so the
# hook, CI and `uv run ruff` agree. Install once with `uvx pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --only-group lint ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --only-group lint ruff format --force-exclude
        language: system
        types_or: [python, pyi]
